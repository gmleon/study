    function centerLegend() {
      // Vega-Lite can't align a legend against a view's title directly, so
      // the legend is flush-right against the bar chart's right edge and
      // vertically centered against the chart title, both by re-translating
      // its rendered group once everything is laid out.
      const legendGroup = document.querySelector("#vis .role-legend");
      const titleText = Array.from(document.querySelectorAll("#vis .role-title-text text")).find(
        (t) => t.textContent.startsWith("Incidence and percentage by country in")
      );
      if (!legendGroup || !titleText) return;
      const inner = legendGroup.querySelector("g");
      if (!inner) return;
      const match = (inner.getAttribute("transform") || "").match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
      if (!match) return;

      const bbox = inner.getBBox();
      const chartWidth = 650;
      const newX = chartWidth - bbox.width;

      const titleRect = titleText.getBoundingClientRect();
      const legendRect = inner.getBoundingClientRect();
      const deltaY = (titleRect.top + titleRect.bottom) / 2 - (legendRect.top + legendRect.bottom) / 2;
      const newY = parseFloat(match[2]) + deltaY;

      inner.setAttribute("transform", `translate(${newX},${newY})`);
    }

    // Provenance tracking: records every year hover via Trrack, so
    // interactions are logged and replayable in reVISit's analysis view.
    import { Registry, initializeTrrack } from "https://cdn.jsdelivr.net/npm/@trrack/core@1.3.0/+esm";

    const provenanceRegistry = Registry.create();
    const setSignalAction = provenanceRegistry.register("set-signal", (state, { key, value }) => {
      state.signals = { ...state.signals, [key]: value };
    });
    const trrack = Revisit.createTrrack({
      initializeTrrack,
      registry: provenanceRegistry,
      initialState: { signals: {} },
    });

    let currentView;
    let suppressSignalCapture = false;
    const lastTracked = {};
    // Vega-Lite unit name owning the "hoverYear" selection (read from the
    // compiled store at embed time; the spec initializes the selection, so the
    // store is non-empty on load).
    let hoverYearUnit = "concat_0_layer_1";

    // Attaches a Trrack-recording listener to each named Vega signal. Skips
    // no-op repeats and anything set programmatically during replay.
    function wireProvenance(view, signalNames) {
      signalNames.forEach((name) => {
        view.addSignalListener(name, (signalName, value) => {
          if (suppressSignalCapture) return;
          const serialized = JSON.stringify(value);
          if (lastTracked[signalName] === serialized) return;
          lastTracked[signalName] = serialized;
          trrack.apply(signalName + ": " + serialized, setSignalAction({ key: signalName, value }));
        });
      });
    }

    // Debounced tooltip recording: one provenance node per *settled* hover
    // (500 ms after the pointer stops), and never a consecutive duplicate of
    // identical content. Stored under a trrack key that is NOT a Vega signal,
    // so replay must not try to push it back into the view (see
    // setSignalIfExists below).
    const TOOLTIP_DEBOUNCE_MS = 500;
    const tooltipTimers = {};
    function recordTooltip(key, content) {
      clearTimeout(tooltipTimers[key]);
      // Replay drives the same listeners; the suppress flag is lifted before a
      // debounced timer would fire, so also bail here at scheduling time.
      if (suppressSignalCapture) return;
      tooltipTimers[key] = setTimeout(() => {
        if (suppressSignalCapture) return;
        const serialized = JSON.stringify(content);
        if (lastTracked[key] === serialized) return;
        lastTracked[key] = serialized;
        trrack.apply(key + ": " + serialized, setSignalAction({ key, value: content }));
      }, TOOLTIP_DEBOUNCE_MS);
    }

    // Replay helper: recorded keys like "tooltip" are not Vega signals, and
    // view.signal() throws "Unrecognized signal name" for them.
    function setSignalIfExists(view, key, value) {
      try { view.signal(key, value); } catch (e) { /* recorded-only key */ }
    }

    // Replay state can arrive before the async embed finishes (reVISit posts

    let pendingProvenance = null;
    function applyProvenance(prov) {
      if (!prov || !prov.signals) return;
      if (!currentView) { pendingProvenance = prov; return; }
      suppressSignalCapture = true;
      Object.entries(prov.signals).forEach(([key, value]) => {
        setSignalIfExists(currentView, key, value);
      });
      // Restore the top chart's hovered-year crosshair from the recorded tooltip.
      // The selection lives in a vconcat child, so its tuple signal is not
      // addressable from the view; the selection store dataset is.
      const t = prov.signals.tooltip;
      if (t && t.Year !== undefined) {
        currentView.data("hoverYear_store", [{
          unit: hoverYearUnit, fields: [{ field: "year", type: "E" }], values: [t.Year],
        }]);
      }
      currentView.runAsync().finally(() => {
        suppressSignalCapture = false;
      });
    }
    Revisit.onProvenanceReceive(applyProvenance);

    Revisit.onDataReceive(() => {
      vegaEmbed("#vis", SPEC, { renderer: "svg", actions: false }).then((res) => {
        currentView = res.view;
        // Top chart: "hoverYear" (a Vega-Lite point selection) used to be
        // tracked on every pointer event. Instead, record the settled hover's
        // tooltip (Year + summed Cases), debounced. The compiled top-level
        // signal resolves to {year: [<year>], ...}.
        const casesByYear = {};
        SPEC.data.values.forEach((d) => { casesByYear[d.year] = (casesByYear[d.year] || 0) + d.cases; });
        const initialStore = res.view.data("hoverYear_store");
        if (initialStore && initialStore.length && initialStore[0].unit) hoverYearUnit = initialStore[0].unit;
        res.view.addSignalListener("hoverYear", (_name, value) => {
          if (!value || !value.year || !value.year.length) return;
          const year = value.year[0];
          recordTooltip("tooltip", { Year: year, Cases: casesByYear[year] });
        });
        // Bottom chart: country bar tooltip (Country, Incidence, Cases, %).
        res.view.addEventListener("pointerover", (_evt, item) => {
          const d = item && item.datum;
          if (!d || d.country === undefined || d.pct_cases === undefined) return;
          recordTooltip("tooltipCountry", {
            Country: d.country,
            "Incidence (per 1,000 at risk)": Number(d.incidence).toFixed(2),
            Cases: d.cases,
            "Percentage of South Asian cases": (d.pct_cases * 100).toFixed(1) + "%",
          });
        });
        centerLegend();
        if (pendingProvenance) {
          const pending = pendingProvenance;
          pendingProvenance = null;
          applyProvenance(pending);
        }
        Revisit.postReady();
      });
    });
  </script>
</html>
