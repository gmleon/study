        font-family: sans-serif;
        font-size: 13px;
        font-weight: normal;
        color: #333;
        white-space: nowrap;
        pointer-events: none;
        border: 1px solid #757575;
        border-radius: 3px;
        padding: 1px 6px;
        background: #f0f0f0;
      }
      #currentYearLabel::after {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 4px solid transparent;
        border-bottom-color: #757575;
      }
      @media (prefers-reduced-motion: reduce) {
        #currentYearLabel { transition: none; }
      }

  </head>

    const YEAR_STEP = 1;
    const PLAY_INTERVAL_MS = 250;

    const CHART_WIDTH = 560;
    const CHART_HEIGHT = 340;

    function buildSpec(year) {
      return {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "description": DESCRIPTION,
        "width": CHART_WIDTH,
        "height": CHART_HEIGHT,
        "title": "Cell phones vs. Internet users per Country over Time",
        "data": { "values": DATA },
        "params": [
          {
            "name": "select_year",
            "value": year,
          },
        ],
        "layer": [
          {
            "transform": [{ "filter": "datum.year === select_year" }],
            "params": [
              {
                "name": "highlight",
                "select": { "type": "point", "fields": ["cluster"] },
                "bind": "legend",
              },
              {
                "name": "zoom",
                "select": "interval",
                "bind": "scales",
              },
              {
                "name": "hover",
                "select": {
                  "type": "point",
                  "on": "pointerover",
                  "clear": "pointerout",
                  "nearest": true,
                  "encodings": ["x", "y"],
                },
              },
            ],
            "mark": { "type": "point", "filled": true, "stroke": "#333", "strokeWidth": 1 },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative", "scale": { "domain": X_DOMAIN, "nice": false }, "title": X_TITLE },
              "y": { "field": Y_FIELD, "type": "quantitative", "scale": { "domain": Y_DOMAIN, "nice": false }, "title": Y_TITLE },
              "size": {
                "field": SIZE_FIELD,
                "type": "quantitative",
                "scale": { "domain": SIZE_DOMAIN, "range": SIZE_RANGE },
                "title": SIZE_TITLE,
                "legend": {
                  "symbolFillColor": "transparent",
                  "symbolStrokeColor": "#444",
                  "symbolStrokeWidth": 1.5,
                  "symbolOpacity": 1,
                },
              },
              "color": { "field": "cluster", "type": "nominal", "title": "Region", "scale": { "domain": REGIONS } },
              "opacity": { "condition": { "param": "highlight", "value": 0.8 }, "value": 0.15 },
              "order": { "field": "country", "sort": "ascending" },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "rule", "color": "#888", "strokeDash": [4, 2] },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative" },
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "y2": { "value": CHART_HEIGHT },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "rule", "color": "#888", "strokeDash": [4, 2] },
            "encoding": {
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "x": { "field": X_FIELD, "type": "quantitative" },
              "x2": { "value": 0 },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "point", "filled": true, "stroke": "#333", "strokeWidth": 1 },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative" },
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "size": { "field": SIZE_FIELD, "type": "quantitative", "scale": { "domain": SIZE_DOMAIN, "range": SIZE_RANGE }, "legend": null },
              "color": { "field": "cluster", "type": "nominal", "scale": { "domain": REGIONS } },
              "opacity": { "condition": { "param": "highlight", "value": 0.8 }, "value": 0.15 },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "text", "dy": -14, "fontWeight": "bold", "fontSize": 11, "stroke": "white", "strokeWidth": 2.5 },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative" },
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "text": { "field": "country", "type": "nominal" },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "text", "dy": -14, "fontWeight": "bold", "fontSize": 11 },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative" },
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "text": { "field": "country", "type": "nominal" },
              "color": { "value": "#222" },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "text", "align": "center", "baseline": "middle", "fontWeight": "bold", "clip": false, "stroke": "white", "strokeWidth": 2.5 },
            "encoding": {
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "x": { "value": -30 },
              "text": { "field": Y_FIELD, "type": "quantitative", "format": ".1f" },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "text", "align": "center", "baseline": "middle", "fontWeight": "bold", "clip": false, "color": "#222" },
            "encoding": {
              "y": { "field": Y_FIELD, "type": "quantitative" },
              "x": { "value": -30 },
              "text": { "field": Y_FIELD, "type": "quantitative", "format": ".1f" },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "text", "align": "center", "baseline": "middle", "fontWeight": "bold", "clip": false, "stroke": "white", "strokeWidth": 2.5 },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative" },
              "y": { "value": CHART_HEIGHT + 14 },
              "text": { "field": X_FIELD, "type": "quantitative", "format": ".1f" },
            },
          },
          {
            "transform": [{ "filter": "datum.year === select_year" }, { "filter": { "param": "hover", "empty": false } }],
            "mark": { "type": "text", "align": "center", "baseline": "middle", "fontWeight": "bold", "clip": false, "color": "#222" },
            "encoding": {
              "x": { "field": X_FIELD, "type": "quantitative" },
              "y": { "value": CHART_HEIGHT + 14 },
              "text": { "field": X_FIELD, "type": "quantitative", "format": ".1f" },
            },
          },
        ],
      };
    }

    // Provenance tracking: records every year change, region-legend click,
    // zoom/pan, and hover via Trrack, so interactions are logged and
    // replayable in reVISit's analysis view.
    import { Registry, initializeTrrack } from "https://cdn.jsdelivr.net/npm/@trrack/core@1.3.0/+esm";

    const provenanceRegistry = Registry.create();
    const setSignalAction = provenanceRegistry.register("set-signal", (state, { key, value }) => {
      state.signals = { ...state.signals, [key]: value };
    });
    const trrack = Revisit.createTrrack({
      initializeTrrack,
      registry: provenanceRegistry,
      initialState: { signals: {} },
    });

    let currentView;
    let suppressSignalCapture = false;
    const lastTracked = {};

    // Attaches a Trrack-recording listener to each named Vega signal. Skips
    // no-op repeats and anything set programmatically during replay.
    function wireProvenance(view, signalNames) {
      signalNames.forEach((name) => {
        view.addSignalListener(name, (signalName, value) => {
          if (suppressSignalCapture) return;
          const serialized = JSON.stringify(value);
          if (lastTracked[signalName] === serialized) return;
          lastTracked[signalName] = serialized;
          trrack.apply(signalName + ": " + serialized, setSignalAction({ key: signalName, value }));
        });
      });
    }

    // Replay state can arrive before the async embed finishes (reVISit posts
    // STUDY_DATA and PROVENANCE back-to-back on window load), so keep the
    // latest one and apply it once the view exists.
    let pendingProvenance = null;
    function applyProvenance(prov) {
      if (!prov || !prov.signals) return;
      if (!currentView) { pendingProvenance = prov; return; }
      suppressSignalCapture = true;
      Object.entries(prov.signals).forEach(([key, value]) => {
        currentView.signal(key, value);
      });
      currentView.runAsync().finally(() => {
        suppressSignalCapture = false;
      });
    }
    Revisit.onProvenanceReceive(applyProvenance);

    Revisit.onDataReceive(() => {
      const btn = document.getElementById("playBtn");
      const slider = document.getElementById("yearSlider");
      const currentLabel = document.getElementById("currentYearLabel");
      const controls = document.getElementById("controls");

      let view = null;
      let timer = null;

      function updateCurrentLabel(year) {
        currentLabel.textContent = year;
        const fraction = (year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR);
        currentLabel.style.left = (fraction * 100) + "%";
      }

      function alignControlsRow() {
        // Align the controls row with the horizontal span of the x-axis.
        const visEl = document.getElementById("vis");
        const visRect = visEl.getBoundingClientRect();
        const domains = Array.from(visEl.querySelectorAll("svg .role-axis-domain"))
          .map((d) => d.getBoundingClientRect());
        const xAxisRect = domains.find((r) => r.width > r.height);
        if (xAxisRect) {
          controls.style.marginLeft = (xAxisRect.left - visRect.left) + "px";
          controls.style.width = xAxisRect.width + "px";
        }
      }

      function positionSizeLegend() {
        // Vega-Lite auto-stacks the size legend directly under the region
        // legend; pull it further down instead so the two are visibly
        // separate, with the size legend's bottom edge flush with the x-axis.
        const svg = document.querySelector("#vis svg");
        const bg = svg && svg.querySelector(".background");
        if (!bg) return;
        const legends = Array.from(svg.querySelectorAll(".role-legend"));
        const sizeLegend = legends.find((l) => (l.getAttribute("aria-label") || "").includes("for size"));
        if (!sizeLegend) return;
        const inner = sizeLegend.querySelector("g");
        const match = inner && (inner.getAttribute("transform") || "").match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
        if (!match) return;

        const bgBottom = bg.getBoundingClientRect().bottom;
        const legendBottom = inner.getBoundingClientRect().bottom;
        const newY = parseFloat(match[2]) + (bgBottom - legendBottom);
        inner.setAttribute("transform", `translate(${match[1]},${newY})`);
      }

      function setPlaying(playing) {
        if (playing) {
          btn.textContent = "⏸";
          timer = setInterval(() => {
            const year = view.signal("select_year");
            if (year >= MAX_YEAR) {
              setPlaying(false);
              return;
            }
            view.signal("select_year", Math.min(year + YEAR_STEP, MAX_YEAR)).runAsync();
          }, PLAY_INTERVAL_MS);
        } else {
          btn.textContent = "▶";
          if (timer) { clearInterval(timer); timer = null; }
        }
      }

      function render(year) {
        const spec = buildSpec(year);
        return vegaEmbed("#vis", spec, { renderer: "svg", actions: false }).then((res) => {
          view = res.view;
          currentView = view;
          // Tracks "highlight_cluster_legend" (the clicked region's raw
          // value) and "zoom_internet_users"/"zoom_cell_phones" (the
          // resulting per-field axis ranges - Vega-Lite names an interval
          // selection's per-channel signals after the bound field, not the
          // channel letter) rather than "highlight"/"zoom" themselves,
          // which are Vega-Lite's resolved-predicate signals -- opaque
          // internal objects that don't usefully convey which region was
          // clicked or how far it zoomed. Note: wireProvenance's forEach
          // aborts (and every listener registration after it in this
          // function, including the slider sync below, is skipped) the
          // instant any one of these names doesn't match a real compiled
          // signal, so a wrong name here silently breaks the whole slider.
          wireProvenance(view, ["select_year", "highlight_cluster_legend", "zoom_internet_users", "zoom_cell_phones", "hover"]);

          view.addSignalListener("select_year", (name, value) => {
            slider.value = value;
            updateCurrentLabel(value);
          });

          const startYear = view.signal("select_year");
          slider.value = startYear;
          updateCurrentLabel(startYear);
          alignControlsRow();
          positionSizeLegend();
        });
      }

      btn.addEventListener("click", () => {
        const willPlay = !timer;
        // Starting from the end of the range would immediately stop
        // itself on the first tick, so restart from the beginning.
        if (willPlay && view.signal("select_year") >= MAX_YEAR) {
          view.signal("select_year", MIN_YEAR).runAsync();
        }
        setPlaying(willPlay);
      });

      slider.addEventListener("input", () => {
        setPlaying(false);
        view.signal("select_year", +slider.value).runAsync();
      });

      render(MIN_YEAR).then(() => {
        if (pendingProvenance) {
          const pending = pendingProvenance;
          pendingProvenance = null;
          applyProvenance(pending);
        }
        Revisit.postReady();
      });
    });
  </script>
</html>
