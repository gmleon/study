    <style>
      body { font-family: sans-serif; }
      #wrapper { display: inline-block; }

      #controls {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        padding-bottom: 32px;
        box-sizing: border-box;
      }
      #playBtn {
        flex: 0 0 auto;
        font-size: 14px;
        padding: 6px 14px;
        border: 1px solid #888;
        border-radius: 4px;
        background: #f4f4f4;

      #playBtn:active { background: #ddd; }
      #minYearLabel, #maxYearLabel {
        flex: 0 0 auto;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: normal;
        color: #000;
      }
      #slider-wrap { position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
      #yearSlider { width: 100%; min-width: 0; cursor: pointer; accent-color: #757575; }
      #currentYearLabel {
        position: absolute;
        top: 22px;
        left: 0;
        transform: translateX(-50%);
        transition: left 0.1s linear;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: normal;
        color: #333;
        white-space: nowrap;
        pointer-events: none;
        border: 1px solid #757575;
        border-radius: 3px;
        padding: 1px 6px;
        background: #f0f0f0;
      }
      #currentYearLabel::after {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 4px solid transparent;
        border-bottom-color: #757575;
      }
      @media (prefers-reduced-motion: reduce) {
        #currentYearLabel { transition: none; }
      }
    </style>
  </head>

    <div id="wrapper">

    </div>
  </body>

    const MIN_YEAR = 1955;
    const MAX_YEAR = 2005;
    const YEAR_STEP = 5;
    const PLAY_INTERVAL_MS = 250;

    Revisit.onDataReceive(() => {
      vegaEmbed("#vis", SPEC, { renderer: "svg", actions: false }).then((res) => {
        const view = res.view;
        const btn = document.getElementById("playBtn");
        const slider = document.getElementById("yearSlider");
        const currentLabel = document.getElementById("currentYearLabel");
        const controls = document.getElementById("controls");
        let timer = null;

        function updateCurrentLabel(year) {
          currentLabel.textContent = year;
          const fraction = (year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR);
          currentLabel.style.left = (fraction * 100) + "%";
        }
        updateCurrentLabel(+slider.value);

        // Align the controls row with the horizontal span of the x-axis.
        const visEl = document.getElementById("vis");
        const visRect = visEl.getBoundingClientRect();
        const domains = Array.from(visEl.querySelectorAll("svg .role-axis-domain"))
          .map((d) => d.getBoundingClientRect());
        const xAxisRect = domains.find((r) => r.width > r.height);
        if (xAxisRect) {
          controls.style.marginLeft = (xAxisRect.left - visRect.left) + "px";
          controls.style.width = xAxisRect.width + "px";
        }

        function setPlaying(playing) {
          if (playing) {
            btn.textContent = "⏸";
            timer = setInterval(() => {
              const year = view.signal("year");
              if (year >= MAX_YEAR) {
                setPlaying(false);
                return;
              }
              view.signal("year", Math.min(year + YEAR_STEP, MAX_YEAR)).runAsync();
            }, PLAY_INTERVAL_MS);
          } else {
            btn.textContent = "▶";
            if (timer) { clearInterval(timer); timer = null; }
          }
        }

        btn.addEventListener("click", () => setPlaying(!timer));

        slider.addEventListener("input", () => {
          setPlaying(false);
          view.signal("year", +slider.value).runAsync();
        });

        view.addSignalListener("year", (name, value) => {
          slider.value = value;
          updateCurrentLabel(value);
        });

        Revisit.postReady();
      });
    });
  </script>
