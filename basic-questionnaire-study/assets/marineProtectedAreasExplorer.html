    // This chart is plain D3 (no Vega signals), so actions are recorded

    import { Registry, initializeTrrack } from "https://cdn.jsdelivr.net/npm/@trrack/core@1.3.0/+esm";

    const provenanceRegistry = Registry.create();
    const selectCountryAction = provenanceRegistry.register("select-country", (state, name) => {
      state.selectedCountry = name || null;
    });
    const hoverCountryAction = provenanceRegistry.register("hover-country", (state, name) => {
      state.hoveredCountry = name || null;
    });
    const trrack = Revisit.createTrrack({
      initializeTrrack,
      registry: provenanceRegistry,
      initialState: { selectedCountry: null, hoveredCountry: null },
    });
    let suppressCapture = false;

    // Hover tracking: one provenance node per *settled* hover (the pointer
    // rests on a dot for 500 ms), never a consecutive duplicate, and nothing
    // for quick passes over dots. Keeps the provenance small.
    const HOVER_DEBOUNCE_MS = 500;
    let hoverTimer = null;
    let lastRecordedHover = null;
    function scheduleHoverRecord(name) {
      clearTimeout(hoverTimer);
      if (suppressCapture) return;
      hoverTimer = setTimeout(() => {
        if (suppressCapture || name === lastRecordedHover) return;
        lastRecordedHover = name;
        trrack.apply("Hover: " + name, hoverCountryAction(name));
      }, HOVER_DEBOUNCE_MS);
    }
    function cancelHoverRecord() {
      clearTimeout(hoverTimer);
    }

      const abnj = DATA.find((d) => d.iso3c === "ABNJ");

      const width = 710;
      const margins = { top: 40, right: 50, bottom: 50, left: 60 };
      const innerW = width - margins.left - margins.right;
      const chartInnerH = 340;

      const xScale = d3.scaleLog().domain([10, 100000000]).range([0, innerW]);
      const xTicks = [10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000];
      const yScale = d3.scaleLinear().domain([0, 100]).range([chartInnerH, 0]);
      const yTicks = [0, 10, 25, 50, 75, 100];

      const regions = [
        "Sub-Saharan Africa", "East Asia & Pacific", "Europe & Central Asia",
        "Middle East & North Africa", "Latin America & Caribbean",
        "South Asia", "North America",
      ];
      const colorScale = d3.scaleOrdinal(regions, d3.schemeTableau10);

      // ── Legend layout (wrap regions into centered rows) ───────────────
      // Laid out before the SVG height is known, since the legend now sits
      // below the chart and its row count determines the total height.
      function layoutLegendRows() {
        const itemWidth = (r) => r.length * 6.5 + 30;
        const rows = [[]];
        let rowWidth = 0;
        regions.forEach((r) => {
          const w = itemWidth(r);
          if (rowWidth + w > innerW && rows[rows.length - 1].length > 0) {
            rows.push([]);
            rowWidth = 0;
          }
          rows[rows.length - 1].push({ region: r, width: w });
          rowWidth += w;
        });
        return rows;
      }
      const legendRows = layoutLegendRows();
      const legendRowH = 20;
      const legendH = legendRows.length * legendRowH;

      const chartTop = margins.top;
      const legendTop = chartTop + chartInnerH + margins.bottom;
      const height = legendTop + legendH + 10;

      const svg = d3.select("#scatter").attr("width", width).attr("height", height);

      svg.append("text")
        .attr("x", margins.left).attr("y", 18)
        .style("font-family", "sans-serif").style("font-size", "13px").style("font-weight", "bold").style("fill", "#000")
        .text("Marine protected areas by country");

      const g = svg.append("g").attr("transform", `translate(${margins.left},${chartTop})`);

      // Scales currently in effect (always xScale/yScale; kept as separate
      // names since drawing code below is written against "current*").
      let currentXScale = xScale;
      let currentYScale = yScale;

      // Everything is clipped to the plot rectangle so marks or gridlines
      // never bleed into the title, axis titles, or legend around the
      // chart. The clip rect is padded slightly beyond the plot's exact
      // bounds so marks sitting right at 0% or 100% (or the search/hover
      // ring around them) aren't sliced off at the edge.
      const clipPad = 9;
      svg.append("defs").append("clipPath")
        .attr("id", "plot-clip")
        .append("rect")
        .attr("x", -clipPad).attr("y", -clipPad)
        .attr("width", innerW + clipPad * 2).attr("height", chartInnerH + clipPad * 2);
      const plotArea = g.append("g").attr("clip-path", "url(#plot-clip)");

      // Grid (horizontal and vertical)
      const xGrid = plotArea.append("g")
        .attr("class", "grid")
        .attr("transform", `translate(0,${chartInnerH})`);
      const yGrid = plotArea.append("g").attr("class", "grid");

      function drawXGrid(scale) {
        xGrid.call(d3.axisBottom(scale).tickValues(xTicks).tickSize(-chartInnerH).tickFormat(""))
          .call((sel) => sel.select(".domain").remove())
          .call((sel) => sel.selectAll("line").attr("stroke", "#ddd"));
      }
      function drawYGrid(scale) {
        yGrid.call(d3.axisLeft(scale).tickValues(yTicks).tickSize(-innerW).tickFormat(""))
          .call((sel) => sel.select(".domain").remove())
          .call((sel) => sel.selectAll("line").attr("stroke", "#ddd"));
      }
      drawXGrid(xScale);
      drawYGrid(yScale);

      // ── Legend (rendered below the chart, rows centered) ──────────────
      const legend = svg.append("g").attr("transform", `translate(${margins.left}, ${legendTop})`);
      legendRows.forEach((row, rowIndex) => {
        const rowWidth = row.reduce((sum, item) => sum + item.width, 0);
        let x = (innerW - rowWidth) / 2;
        row.forEach(({ region: r, width: w }) => {
          const item = legend.append("g").attr("transform", `translate(${x}, ${rowIndex * legendRowH})`);
          item.append("circle").attr("r", 6).attr("cx", 6).attr("cy", 6).attr("fill", colorScale(r));
          item.append("text").attr("x", 16).attr("y", 10).style("font-size", "12px").text(r);
          x += w;
        });
      });

      // Axes
      const xAxis = g.append("g").attr("transform", `translate(0,${chartInnerH})`);
      const yAxis = g.append("g");
      // Only ticks within the scale's current domain are passed in, so a
      // tick for an out-of-range value doesn't get drawn past the plot edge.
      function drawXAxis(scale) {
        const [d0, d1] = scale.domain();
        const visible = xTicks.filter((t) => t >= d0 && t <= d1);
        xAxis.call(d3.axisBottom(scale).tickValues(visible).tickFormat(d3.format("~s")));
      }
      function drawYAxis(scale) {
        const [d0, d1] = scale.domain();
        const visible = yTicks.filter((t) => t >= d0 && t <= d1);
        yAxis.call(d3.axisLeft(scale).tickValues(visible).tickFormat((d) => d + "%"));
      }
      drawXAxis(xScale);
      drawYAxis(yScale);

      g.append("text")
        .attr("x", innerW / 2).attr("y", chartInnerH + 38)
        .attr("text-anchor", "middle")
        .style("font-family", "sans-serif").style("font-size", "11px").style("font-weight", "bold").style("fill", "#000")
        .text("Total marine area (logarithmic scale)");
      g.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -chartInnerH / 2).attr("y", -45)
        .attr("text-anchor", "middle")
        .style("font-family", "sans-serif").style("font-size", "11px").style("font-weight", "bold").style("fill", "#000")
        .text("Percentage of total marine area protected");

      // Reference line at 0% (baseline)
      const refLine = plotArea.append("line")
        .attr("x1", 0).attr("x2", innerW)
        .attr("y1", yScale(0)).attr("y2", yScale(0))
        .attr("stroke", "black").attr("stroke-width", 1.5);

      const radius = 5;
      const tooltip = d3.select("#mpa-tooltip");

      function showTooltip(evt, d) {
        tooltip
          .style("display", "block")
          .style("left", evt.clientX + 14 + "px")
          .style("top", evt.clientY + 10 + "px")
          .html(
            "<strong>" + d.country + "</strong><br>" +
            d3.format(",.0f")(d.totalmarinearea) + " km² total marine area<br>" +
            d3.format(",.1f")(d.PAmarinecover) + "% protected"
          );
      }
      function hideTooltip() {
        tooltip.style("display", "none");
      }

      const dotsSel = plotArea.selectAll("circle.dot")
        .data(countries)
        .join("circle")
        .attr("class", "dot")
        .attr("cx", (d) => currentXScale(d.totalmarinearea))
        .attr("cy", (d) => currentYScale(d.PAmarinecover))
        .attr("r", radius)
        .attr("fill", (d) => colorScale(d.region))
        .attr("stroke", "white")
        .attr("stroke-width", 1)
        .attr("opacity", 0.85)
        .on("mouseover", (evt, d) => { showTooltip(evt, d); highlightHover(d); scheduleHoverRecord(d.country); })
        .on("mousemove", (evt, d) => showTooltip(evt, d))
        .on("mouseout", (evt, d) => { hideTooltip(); highlightHover(null); cancelHoverRecord(); })
        .on("click", (evt, d) => {
          searchInput.value = d.country;
          selectCountry(d.country);
          suggestionsList.style.display = "none";
        });

      // ABNJ special point
      let abnjDot = null;
      if (abnj) {
        abnjDot = plotArea.append("circle")
          .attr("class", "dot")
          .attr("cx", currentXScale(abnj.totalmarinearea))
          .attr("cy", currentYScale(abnj.PAmarinecover))
          .attr("r", radius)
          .attr("fill", "#888")
          .attr("stroke", "white")
          .attr("stroke-width", 1)
          .attr("opacity", 0.85)
          .on("mouseover", (evt) => { showTooltip(evt, abnj); scheduleHoverRecord(abnj.country); })
          .on("mousemove", (evt) => showTooltip(evt, abnj))
          .on("mouseout", () => { hideTooltip(); cancelHoverRecord(); });
      }

      const hoverRing = plotArea.append("circle").attr("class", "dot-outline").attr("r", radius + 2).style("display", "none");
      // Country name shown next to the hovered dot during replay (same look as
      // the search result label; live hovers use the pointer tooltip instead).
      const hoverLabel = plotArea.append("text").attr("class", "country-label").style("display", "none");
      let hoveredDatum = null;
      function highlightHover(d) {
        hoveredDatum = d;
        if (!d) { hoverRing.style("display", "none"); return; }
        hoverRing
          .attr("cx", currentXScale(d.totalmarinearea)).attr("cy", currentYScale(d.PAmarinecover))
          .style("display", null);
      }

      // ── Search bar / country picker ────────────────────────────────
      const sortedCountries = countries.slice().sort((a, b) => a.country.localeCompare(b.country));

      const searchRing = plotArea.append("circle").attr("class", "dot-outline").style("display", "none");
      const searchLabel = plotArea.append("text").attr("class", "country-label").style("display", "none");
      let selectedMatch = null;

      function selectCountry(name) {
        if (!suppressCapture) {
          trrack.apply(name ? "Search: " + name : "Clear search", selectCountryAction(name));
        }
        const match = countries.find((d) => d.country.toLowerCase() === name.toLowerCase());
        selectedMatch = match || null;
        if (!match) {
          searchRing.style("display", "none");
          searchLabel.style("display", "none");
          return;
        }
        const cx = currentXScale(match.totalmarinearea), cy = currentYScale(match.PAmarinecover);
        searchRing.attr("cx", cx).attr("cy", cy).attr("r", radius + 3).style("display", null);
        searchLabel.attr("x", cx + 10).attr("y", cy + 4).text(match.country).style("display", null);
      }

      // Custom filtered suggestions list: only shows matches for what's been
      // typed so far, with no default "show everything" dropdown button.
      const searchInput = document.getElementById("countrySearch");
      const suggestionsList = document.getElementById("countrySuggestions");

      function renderSuggestions(query) {
        suggestionsList.innerHTML = "";
        const q = query.trim().toLowerCase();
        if (!q) { suggestionsList.style.display = "none"; return; }
        const matches = sortedCountries.filter((d) => d.country.toLowerCase().includes(q));
        if (matches.length === 0) { suggestionsList.style.display = "none"; return; }
        matches.forEach((d) => {
          const li = document.createElement("li");
          li.textContent = d.country;
          li.addEventListener("mousedown", (evt) => {
            evt.preventDefault();
            searchInput.value = d.country;
            selectCountry(d.country);
            suggestionsList.style.display = "none";
          });
          suggestionsList.appendChild(li);
        });
        suggestionsList.style.display = "block";
      }

      searchInput.addEventListener("input", (evt) => {
        selectCountry(evt.target.value);
        renderSuggestions(evt.target.value);
      });
      searchInput.addEventListener("focus", (evt) => renderSuggestions(evt.target.value));
      searchInput.addEventListener("blur", () => {
        setTimeout(() => { suggestionsList.style.display = "none"; }, 100);
      });

      document.getElementById("clearSearch").addEventListener("click", () => {
        searchInput.value = "";
        selectCountry("");
        suggestionsList.style.display = "none";
        searchInput.focus();
      });

      // Replay: restore the search selection and the hovered country. There is
      // no pointer during replay, so the hovered dot gets the hover ring plus
      // its country name next to it, matching how a search result is shown.
      function replayHover(name) {
        cancelHoverRecord();
        hideTooltip();
        const d = name ? [...countries, ...(abnj ? [abnj] : [])].find((c) => c.country === name) : null;
        if (!d) { highlightHover(null); hoverLabel.style("display", "none"); return; }
        const cx = currentXScale(d.totalmarinearea), cy = currentYScale(d.PAmarinecover);
        hoverRing.attr("cx", cx).attr("cy", cy).style("display", null);
        hoverLabel.attr("x", cx + 10).attr("y", cy + 4).text(d.country).style("display", null);
      }

      Revisit.onProvenanceReceive((prov) => {
        if (!prov) return;
        suppressCapture = true;
        searchInput.value = prov.selectedCountry || "";
        selectCountry(prov.selectedCountry || "");
        replayHover(prov.hoveredCountry || null);
        suppressCapture = false;
      });

      Revisit.postReady();
    });
  </script>
</html>
