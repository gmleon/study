<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>School levels by province explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <!-- Load revisit-communicate to be able to send data to reVISit -->
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <style>
      body { font-family: sans-serif; }
      #wrapper { display: inline-block; }
      #header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 4px;
      }
      #chart-title {
        font-family: sans-serif;
        font-size: 13px;
        font-weight: bold;
        color: #000;
        margin: 0;
      }
      #toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: normal;
        color: #000;
      }
      .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .switch .track {
        position: absolute; inset: 0; cursor: pointer;
        background-color: #fff; border: 1.5px solid #333;
        border-radius: 24px; transition: background-color 0.2s;
      }
      .switch .track:before {
        position: absolute; content: "";
        height: 16px; width: 16px; left: 3px; top: 3px;
        background-color: #333; border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .track:before { transform: translateX(22px); }
    </style>
  </head>

  <body>
    <div id="wrapper">
      <div id="header-row">
        <h2 id="chart-title"></h2>
        <div id="toggle-row">
          <span>Rural</span>
          <label class="switch">
            <input type="checkbox" id="areaToggle" />
            <span class="track"></span>
          </label>
          <span>Urban</span>
        </div>
      </div>
      <div id="vis"></div>
    </div>
  </body>

  <script>
    const SPEC = {"$schema":"https://vega.github.io/schema/vega-lite/v5.json","description":"Simplified recreation of the 'Most schools in Pakistan are primary schools' stacked bar chart from the World Bank's 'Five major challenges to girls' education in Pakistan' data story (https://datatopics.worldbank.org/dataviz/girls-education-pakistan/). Data: datatopics.worldbank.org/dataviz/girls-education-pakistan/data/schools.tsv. The Rural/Urban switch above the chart is a real HTML sliding toggle (page JS), not a Vega-Lite bind, so it can be centered above the chart and styled like the original.","width":600,"height":400,"data":{"values":[{"province":"Balochistan","area":"Urban","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":67.7},{"province":"Balochistan","area":"Urban","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":14.6},{"province":"Balochistan","area":"Urban","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":17.7},{"province":"KP","area":"Urban","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":36.3},{"province":"KP","area":"Urban","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":23.8},{"province":"KP","area":"Urban","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":39.9},{"province":"Punjab","area":"Urban","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":57.2},{"province":"Punjab","area":"Urban","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":22.5},{"province":"Punjab","area":"Urban","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":20.3},{"province":"Sindh","area":"Urban","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":40.3},{"province":"Sindh","area":"Urban","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":26.6},{"province":"Sindh","area":"Urban","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":33.1},{"province":"Balochistan","area":"Rural","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":82.5},{"province":"Balochistan","area":"Rural","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":10.4},{"province":"Balochistan","area":"Rural","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":7.1},{"province":"KP","area":"Rural","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":70.4},{"province":"KP","area":"Rural","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":14.5},{"province":"KP","area":"Rural","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":15.1},{"province":"Punjab","area":"Rural","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":31.5},{"province":"Punjab","area":"Rural","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":44.4},{"province":"Punjab","area":"Rural","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":24.1},{"province":"Sindh","area":"Rural","level":"Primary (Ages 5-10)","levelOrder":1,"percentage":89.5},{"province":"Sindh","area":"Rural","level":"Middle (Ages 11-14)","levelOrder":2,"percentage":6.7},{"province":"Sindh","area":"Rural","level":"Secondary (Ages 15-16)","levelOrder":3,"percentage":3.8}]},"params":[{"name":"selectedArea","value":"Rural"},{"name":"highlight","select":{"type":"point","fields":["level"]},"bind":"legend"}],"transform":[{"filter":"datum.area === selectedArea"}],"mark":{"type":"bar","width":{"band":0.7}},"encoding":{"x":{"field":"province","type":"nominal","sort":["Balochistan","KP","Sindh","Punjab"],"title":"Province","axis":{"labelAngle":0}},"y":{"field":"percentage","type":"quantitative","title":"Percentage of school level (%)","stack":"zero","scale":{"domain":[0,100]},"axis":{"grid":false}},"color":{"field":"level","type":"nominal","title":"School level","scale":{"domain":["Primary (Ages 5-10)","Middle (Ages 11-14)","Secondary (Ages 15-16)"],"range":["#4c78a8","#f58518","#b279a2"]}},"opacity":{"condition":{"param":"highlight","value":1},"value":0.2},"order":{"field":"levelOrder"},"tooltip":[{"field":"province","type":"nominal","title":"Province"},{"field":"level","type":"nominal","title":"School level"},{"field":"percentage","type":"quantitative","title":"Percentage (%)","format":".1f"}]},"config":{"view":{"stroke":null},"axis":{"domainColor":"#888","tickColor":"#888"}}};

    function setTitle(area) {
      document.getElementById("chart-title").textContent =
        "Percentage of school level by province (" + area + ")";
    }

    function describeHighlight(value) {
      const level = value && value.level && value.level[0];
      return level ? "Highlight legend: " + level : "Clear legend highlight";
    }
  </script>

  <!-- Provenance tracking: records the Rural/Urban toggle and legend clicks via Trrack,
       so both interactions are logged and replayable in reVISit's analysis view. -->
  <script type="module">
    import { Registry, initializeTrrack } from "https://cdn.jsdelivr.net/npm/@trrack/core@1.3.0/+esm";

    const registry = Registry.create();
    const setAreaAction = registry.register("set-area", (state, area) => {
      state.selectedArea = area;
    });
    const setHighlightAction = registry.register("set-highlight", (state, value) => {
      state.highlight = value;
    });
    const setTooltipAction = registry.register("set-tooltip", (state, value) => {
      state.tooltip = value;
    });

    const trrack = Revisit.createTrrack({
      initializeTrrack,
      registry,
      initialState: { selectedArea: "Rural", highlight: {}, tooltip: null },
    });

    let view;
    let suppressSignalCapture = false;

    // Pure render: reflects a given state onto the toggle + Vega view. Used both after a
    // real interaction (via trrack.currentChange) and during replay (via onProvenanceReceive).
    // Never itself calls trrack.apply, so it can't create a feedback loop.
    function renderState(state) {
      setTitle(state.selectedArea);
      const toggle = document.getElementById("areaToggle");
      if (toggle) toggle.checked = state.selectedArea === "Urban";
      if (!view) return;
      suppressSignalCapture = true;
      view.signal("selectedArea", state.selectedArea);
      view.signal("highlight", state.highlight ?? {});
      view.runAsync().finally(() => {
        suppressSignalCapture = false;
      });
    }

    trrack.currentChange(() => renderState(trrack.getState()));

    // Keep the latest replayed state so it can be re-applied once the async
    // embed finishes (reVISit posts it right after STUDY_DATA, before the
    // view exists).
    let lastReceivedState = null;
    Revisit.onProvenanceReceive((prov) => {
      if (!prov) return;
      lastReceivedState = prov;
      renderState(prov);
    });

    Revisit.onDataReceive(() => {
      renderState(trrack.getState());
      vegaEmbed("#vis", SPEC, { renderer: "svg", actions: false }).then((res) => {
        view = res.view;
        renderState(lastReceivedState || trrack.getState());

        const toggle = document.getElementById("areaToggle");
        toggle.addEventListener("change", () => {
          const area = toggle.checked ? "Urban" : "Rural";
          trrack.apply("Toggle area: " + area, setAreaAction(area));
        });

        view.addSignalListener("highlight", (name, value) => {
          if (suppressSignalCapture) return;
          trrack.apply(describeHighlight(value), setHighlightAction(value));
        });

        // Bar tooltip (Province / School level / Percentage), recorded once per
        // settled hover (500 ms debounce) and never as a consecutive duplicate.
        let tooltipTimer = null;
        let lastTooltip = null;
        view.addEventListener("pointerover", (_evt, item) => {
          const d = item && item.datum;
          if (!d || d.province === undefined || d.level === undefined) return;
          const content = {
            Province: d.province,
            "School level": d.level,
            "Percentage (%)": Number(d.percentage).toFixed(1),
          };
          clearTimeout(tooltipTimer);
          tooltipTimer = setTimeout(() => {
            if (suppressSignalCapture) return;
            const serialized = JSON.stringify(content);
            if (serialized === lastTooltip) return;
            lastTooltip = serialized;
            trrack.apply("Tooltip: " + d.province + " / " + d.level, setTooltipAction(content));
          }, 500);
        });

        Revisit.postReady();
      });
    });
  </script>
</html>
