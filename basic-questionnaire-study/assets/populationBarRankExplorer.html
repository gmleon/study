  <head>
    <meta charset="UTF-8" />
    <title>Most populous countries explorer</title>

    <!-- Load revisit-communicate to be able to send data to reVISit -->
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <style>
      body { font-family: sans-serif; }
      #controls { display: flex; align-items: center; gap: 10px; margin-top: 6px; box-sizing: border-box; }
      #playBtn {
        flex: 0 0 auto;
        font-size: 14px;
        padding: 6px 14px;
        border: 1px solid #888;
        border-radius: 4px;
        background: #f4f4f4;
        cursor: pointer;
      }
      #playBtn:hover { background: #e8e8e8; }
      #playBtn:active { background: #ddd; }
      #yearPrefix, #minYearLabel, #maxYearLabel {
        flex: 0 0 auto;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: normal;
        color: #000;
      }
      #slider-wrap { position: relative; flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
      #yearSlider { width: 100%; min-width: 0; cursor: pointer; accent-color: #757575; }
      #currentYearLabel {
        position: absolute;
        top: 22px;
        left: 0;
        transform: translateX(-50%);
        transition: left 0.1s linear;
        font-family: sans-serif;
        font-size: 13px;
        font-weight: normal;
        color: #333;
        white-space: nowrap;
        pointer-events: none;
        border: 1px solid #757575;
        border-radius: 3px;
        padding: 1px 6px;
        background: #f0f0f0;
      }
      #currentYearLabel::after {
        content: "";
        position: absolute;
        bottom: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 4px solid transparent;
        border-bottom-color: #757575;
      }
      @media (prefers-reduced-motion: reduce) {
        #currentYearLabel { transition: none; }
      }
    </style>
  </head>

  <body>
    <div id="vis"></div>
    <div id="controls">
      <span id="yearPrefix">Year</span>
      <button id="playBtn" type="button">▶</button>
      <span id="minYearLabel">1900</span>
      <div id="slider-wrap">
        <span id="currentYearLabel">1900</span>
        <input type="range" id="yearSlider" min="1900" max="2011" step="1" value="1900" />
      </div>
      <span id="maxYearLabel">2011</span>
    </div>
  </body>

    const MIN_YEAR = 1900;
    const MAX_YEAR = 2011;
    const PLAY_INTERVAL_MS = 250;

    // Provenance tracking: records every year change and bar click via
    // Trrack, so interactions are logged and replayable in reVISit's analysis view.
    import { Registry, initializeTrrack } from "https://cdn.jsdelivr.net/npm/@trrack/core@1.3.0/+esm";

    const provenanceRegistry = Registry.create();
    const setSignalAction = provenanceRegistry.register("set-signal", (state, { key, value }) => {
      state.signals = { ...state.signals, [key]: value };
    });
    const trrack = Revisit.createTrrack({
      initializeTrrack,
      registry: provenanceRegistry,
      initialState: { signals: {} },
    });

    let currentView;
    let suppressSignalCapture = false;
    const lastTracked = {};

    // Attaches a Trrack-recording listener to each named Vega signal. Skips
    // no-op repeats and anything set programmatically during replay.
    function wireProvenance(view, signalNames) {
      signalNames.forEach((name) => {
        view.addSignalListener(name, (signalName, value) => {
          if (suppressSignalCapture) return;
          const serialized = JSON.stringify(value);
          if (lastTracked[signalName] === serialized) return;
          lastTracked[signalName] = serialized;
          trrack.apply(signalName + ": " + serialized, setSignalAction({ key: signalName, value }));
        });
      });
    }

    // Replay state can arrive before the async embed finishes (reVISit posts
    // STUDY_DATA and PROVENANCE back-to-back on window load), so keep the
    // latest one and apply it once the view exists.
    let pendingProvenance = null;
    function applyProvenance(prov) {
      if (!prov || !prov.signals) return;
      if (!currentView) { pendingProvenance = prov; return; }
      suppressSignalCapture = true;
      Object.entries(prov.signals).forEach(([key, value]) => {
        currentView.signal(key, value);
      });
      currentView.runAsync().finally(() => {
        suppressSignalCapture = false;
      });
    }
    Revisit.onProvenanceReceive(applyProvenance);

    Revisit.onDataReceive(() => {
      vegaEmbed("#vis", SPEC, { renderer: "svg", actions: false }).then((res) => {
        const view = res.view;
        currentView = view;
        wireProvenance(view, ["selectedYear", "selectedCountry"]);

        // Bar clicks are handled with a plain signal + manual click
        // listener rather than a Vega-Lite "point" selection: with the
        // window-transformed/ranked bar data, Vega-Lite's compiled
        // selection machinery (select_tuple -> select_modify -> select)
        // reliably throws "Cannot add property Symbol(vega_id), object is
        // not extensible" when a bar is clicked, silently aborting the
        // pulse before the color-condition encoding ever re-evaluates (the
        // bar visually never highlights, even though the underlying signal
        // update - and therefore provenance tracking - still occurs, which
        // is why this only showed up as a "no visual feedback" bug).
        view.addEventListener("click", (event, item) => {
          if (!item || !item.datum || typeof item.datum.country !== "string") return;
          const country = item.datum.country;
          const current = view.signal("selectedCountry");
          view.signal("selectedCountry", country === current ? null : country).runAsync();
        });
        const btn = document.getElementById("playBtn");
        const slider = document.getElementById("yearSlider");
        const minLabel = document.getElementById("minYearLabel");
        const maxLabel = document.getElementById("maxYearLabel");
        const currentLabel = document.getElementById("currentYearLabel");
        const controls = document.getElementById("controls");
        let timer = null;

        minLabel.textContent = MIN_YEAR;
        maxLabel.textContent = MAX_YEAR;

        function updateCurrentLabel(year) {
          currentLabel.textContent = year;
          const fraction = (year - MIN_YEAR) / (MAX_YEAR - MIN_YEAR);
          currentLabel.style.left = (fraction * 100) + "%";
        }
        updateCurrentLabel(+slider.value);

        // Align the controls row with the horizontal span of the x-axis.
        const visEl = document.getElementById("vis");
        const visRect = visEl.getBoundingClientRect();
        const domains = Array.from(visEl.querySelectorAll("svg .role-axis-domain"))
          .map((d) => d.getBoundingClientRect());
        const xAxisRect = domains.find((r) => r.width > r.height);
        if (xAxisRect) {
          controls.style.marginLeft = (xAxisRect.left - visRect.left) + "px";
          controls.style.width = xAxisRect.width + "px";
        }

        function setPlaying(playing) {
          if (playing) {
            btn.textContent = "⏸";
            timer = setInterval(() => {
              const year = view.signal("selectedYear");
              if (year >= MAX_YEAR) {
                setPlaying(false);
                return;
              }
              view.signal("selectedYear", year + 1).runAsync();
            }, PLAY_INTERVAL_MS);
          } else {
            btn.textContent = "▶";
            if (timer) { clearInterval(timer); timer = null; }
          }
        }

        btn.addEventListener("click", () => {
          const willPlay = !timer;
          // Starting from the end of the range would immediately stop
          // itself on the first tick, so restart from the beginning.
          if (willPlay && view.signal("selectedYear") >= MAX_YEAR) {
            view.signal("selectedYear", MIN_YEAR).runAsync();
          }
          setPlaying(willPlay);
        });

        slider.addEventListener("input", () => {
          setPlaying(false);
          view.signal("selectedYear", +slider.value).runAsync();
        });

        view.addSignalListener("selectedYear", (name, value) => {
          slider.value = value;
          updateCurrentLabel(value);
        });

        if (pendingProvenance) {
          const pending = pendingProvenance;
          pendingProvenance = null;
          applyProvenance(pending);
        }
        Revisit.postReady();
      });
    });
