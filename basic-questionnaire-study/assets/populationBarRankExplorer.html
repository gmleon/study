    Revisit.onDataReceive(() => {
      vegaEmbed("#vis", SPEC, { renderer: "svg", actions: false }).then((res) => {
        const view = res.view;
        const btn = document.getElementById("playBtn");
        let timer = null;

        function setPlaying(playing) {
          if (playing) {
            btn.textContent = "⏸ Pause";
            timer = setInterval(() => {
              const year = view.signal("selectedYear");
              if (year >= MAX_YEAR) {
                setPlaying(false);
                return;
              }
              view.signal("selectedYear", year + 1).runAsync();
            }, PLAY_INTERVAL_MS);
          } else {
            btn.textContent = "▶ Play";
            if (timer) { clearInterval(timer); timer = null; }
          }
        }

        btn.addEventListener("click", () => setPlaying(!timer));
        Revisit.postReady();
      });
